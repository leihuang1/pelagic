name: Language bindings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: bindings-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x64}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x64, interpreter: python}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: ${{ steps.toolchain.outputs.version }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out dist -i ${{ matrix.interpreter || 'python3.11' }}
      - name: Install the built wheel and test dependencies
        shell: bash
        run: |
          python -c 'import glob,subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install",glob.glob("dist/*.whl")[0]+"[test]"])'
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI with the wheel's runtime for exact comparison
        shell: bash
        env:
          # The wheel uses the dynamic CRT; static CRT math can differ in its last bits.
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreadedDLL
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: |
          rustup show
          cargo build --locked --release -p cli
          if cargo tree --locked -p pelagic-python --edges normal | grep -i hdf5; then exit 1; fi
      - name: Compare complete curated cases and failure contracts
        shell: bash
        run: |
          export PELAGIC_CLI="$PWD/target/release/pelagic"
          if [ "$RUNNER_OS" = Windows ]; then export PELAGIC_CLI="$PELAGIC_CLI.exe"; fi
          python -m pytest python/tests -q -rs
      - name: Optional arlpy bridge (explicit registration, no executable)
        if: matrix.platform == 'linux-x64'
        run: |
          python -m pip install 'arlpy>=1.9,<2'
          python -m pytest python/tests/test_arlpy.py -q
          python -m pytest python/tests/test_examples.py -q -k arlpy_backend
      - name: Verify dependency license snapshots
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          (cd crates/python && cargo bundle-licenses --format json --output /tmp/python-licenses.json --previous ../../python/pelagic/THIRD-PARTY-LICENSES.json --check-previous)
          (cd crates/cli && cargo bundle-licenses --format json --output /tmp/cli-licenses.json --previous ../../packaging/cli-licenses.json --check-previous)
      - name: Build standalone Windows CLI with static CRT
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: cargo build --locked --release -p cli --target ${{ matrix.target }}
      - name: Stage matching CLI and license notices
        shell: bash
        run: |
          mkdir -p cli
          binary=target/release/pelagic
          if [ "$RUNNER_OS" = Windows ]; then binary="target/${{ matrix.target }}/release/pelagic.exe"; fi
          cp "$binary" cli/
          cp LICENSE NOTICE cli/
          cp packaging/cli-licenses.json cli/THIRD-PARTY-LICENSES.json
          python -c 'import pathlib,hashlib; p=pathlib.Path("cli"); (p/"SHA256SUMS").write_text("".join(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n" for f in sorted(p.iterdir()) if f.is_file()))'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: cli/

  python-compatibility:
    needs: wheels
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - {python: '3.9', numpy: 'numpy==1.26.4'}
          - {python: '3.14', numpy: 'numpy>=2.3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with: {name: wheel-linux-x64, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: cli-linux-x64, path: cli}
      - shell: bash
        run: |
          python -m pip install dist/*.whl '${{ matrix.numpy }}' pytest h5py pandas xarray
          chmod +x cli/pelagic
          PELAGIC_CLI="$PWD/cli/pelagic" python -m pytest python/tests/test_bindings.py -q

  matlab:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary release platform: exercise ProcessBuilder and the bundled .exe there too.
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-artifacts
      - name: Verify and stage bundled CLIs
        shell: bash
        run: python tools/stage-matlab.py cli-artifacts matlab/bin
      - name: Exercise toolbox archive execute-bit loss
        if: runner.os == 'Linux'
        run: chmod a-x matlab/bin/linux-x64/pelagic
      - uses: matlab-actions/setup-matlab@v2
        with: {release: R2025b}
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_bindings; test_curated; test_examples
      - name: Package the toolbox once, from the Linux runner
        if: runner.os == 'Linux'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); build_toolbox
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with: {name: matlab-toolbox, path: target/pelagic.mltbx}

  octave:
    needs: wheels
    # jsonencode/jsondecode require Octave 7+; Ubuntu 22.04 ships 6.4, 24.04 ships 8.4.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: cli-linux-x64, path: cli}
      - name: Install Octave and Java
        timeout-minutes: 10
        run: |
          # The hosted runner's Azure mirror can throttle large package downloads.
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave default-jre-headless
          octave --no-gui --quiet --eval "assert(compare_versions(OCTAVE_VERSION, '7.0.0', '>='), 'Octave 7+ required')"
      - name: Octave uses the same adapter tests
        run: |
          chmod +x cli/pelagic
          PELAGIC_CLI="$PWD/cli/pelagic" octave --no-gui --quiet --eval "addpath('matlab/tests'); test_bindings; test_curated"

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with: {name: python-sdist, path: dist/*.tar.gz}

  publish-pypi:
    if: github.event_name == 'release'
    needs: [wheels, python-compatibility, matlab, octave, sdist]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: wheel-*, path: dist, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: python-sdist, path: dist}
      - name: Require the release tag to match every built wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email, glob, os, zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 5, wheels
          for path in wheels:
              with zipfile.ZipFile(path) as wheel:
                  names = [n for n in wheel.namelist() if n.endswith('.dist-info/METADATA')]
                  assert len(names) == 1
                  metadata = email.message_from_bytes(wheel.read(names[0]))
                  assert metadata['Version'] == os.environ['RELEASE_TAG'].removeprefix('v')
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    # The Windows ZIP is attached by release.yml; this adds the other CLIs and the toolbox.
    if: github.event_name == 'release'
    needs: [wheels, python-compatibility, matlab, octave, sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: cli-*, path: cli-artifacts}
      - uses: actions/download-artifact@v4
        with: {name: matlab-toolbox, path: toolbox}
      - name: Package macOS/Linux CLIs and the MATLAB toolbox
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < matlab/VERSION)"
          test "$RELEASE_TAG" = "v$version" || { echo "Release tag must be v$version" >&2; exit 1; }
          mkdir dist
          for platform in linux-x64 linux-arm64 macos-arm64 macos-x64; do
            source="cli-artifacts/cli-$platform"
            (cd "$source" && sha256sum --check --strict SHA256SUMS)
            name="pelagic-v$version-$platform"
            mkdir -p "stage/$name"
            cp "$source/pelagic" "$source/LICENSE" "$source/NOTICE" "$source/THIRD-PARTY-LICENSES.json" "stage/$name/"
            # Artifact downloads drop Unix execute bits.
            chmod 755 "stage/$name/pelagic"
            printf 'Pelagic v%s (%s)\nCommit: %s\nSource: https://github.com/%s/archive/%s.zip\n' \
              "$version" "$platform" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "stage/$name/BUILD-INFO.txt"
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          done
          cp toolbox/pelagic.mltbx "dist/pelagic-v$version.mltbx"
          cd dist
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Attach to this Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release upload "$RELEASE_TAG" * --clobber
