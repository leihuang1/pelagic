name: Language bindings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
concurrency:
  group: bindings-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x64}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x64, interpreter: python}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          rust-toolchain: ${{ steps.toolchain.outputs.version }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: --release --locked --out dist -i ${{ matrix.interpreter || 'python3.11' }}
      - name: Install the built wheel and test dependencies
        shell: bash
        run: |
          python -c 'import glob,subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install",glob.glob("dist/*.whl")[0]+"[test]"])'
      - uses: Swatinem/rust-cache@v2
      - name: Build matching CLI for independent HDF5 comparison and MATLAB
        shell: bash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: |
          rustup show
          cargo build --locked --release -p cli
          if cargo tree --locked -p pelagic-python --edges normal | grep -i hdf5; then exit 1; fi
      - name: Compare complete curated cases and failure contracts
        shell: bash
        run: |
          export PELAGIC_CLI="$PWD/target/release/pelagic"
          if [ "$RUNNER_OS" = Windows ]; then export PELAGIC_CLI="$PELAGIC_CLI.exe"; fi
          python -m pytest python/tests -q
      - name: Optional arlpy bridge (explicit registration, no executable)
        if: matrix.platform == 'linux-x64'
        run: |
          python -m pip install 'arlpy>=1.9,<2'
          python -m pytest python/tests/test_arlpy.py -q
      - name: Verify dependency license snapshots
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          cargo install --locked cargo-bundle-licenses --version 4.2.0
          (cd crates/python && cargo bundle-licenses --format json --output /tmp/python-licenses.json --previous ../../python/pelagic/THIRD-PARTY-LICENSES.json --check-previous)
          (cd crates/cli && cargo bundle-licenses --format json --output /tmp/cli-licenses.json --previous ../../packaging/cli-licenses.json --check-previous)
      - name: Stage matching CLI and license notices
        shell: bash
        run: |
          mkdir -p cli
          binary=pelagic
          if [ "$RUNNER_OS" = Windows ]; then binary=pelagic.exe; fi
          cp "target/release/$binary" cli/
          cp LICENSE NOTICE cli/
          cp packaging/cli-licenses.json cli/THIRD-PARTY-LICENSES.json
          python -c 'import pathlib,hashlib; p=pathlib.Path("cli"); (p/"SHA256SUMS").write_text("".join(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n" for f in sorted(p.iterdir()) if f.is_file()))'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: cli/

  python-compatibility:
    needs: wheels
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - {python: '3.9', numpy: 'numpy==1.26.4'}
          - {python: '3.14', numpy: 'numpy>=2.3'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with: {name: wheel-linux-x64, path: dist}
      - uses: actions/download-artifact@v4
        with: {name: cli-linux-x64, path: cli}
      - shell: bash
        run: |
          python -m pip install dist/*.whl '${{ matrix.numpy }}' pytest h5py pandas xarray
          chmod +x cli/pelagic
          PELAGIC_CLI="$PWD/cli/pelagic" python -m pytest python/tests/test_bindings.py -q

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with: {name: python-sdist, path: dist/*.tar.gz}
