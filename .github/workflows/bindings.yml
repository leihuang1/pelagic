name: Language bindings
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      wheels: ${{ steps.plan.outputs.wheels }}
      platforms: ${{ steps.plan.outputs.platforms }}
      full: ${{ steps.changes.outputs.full }}
      others: ${{ steps.plan.outputs.others }}
      tests: ${{ steps.plan.outputs.tests }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify documentation-only changes
        id: changes
        run: python3 tools/ci/changes.py
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        shell: python3 {0}
        run: |
          import json, os
          wheels = [
              {"os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "platform": "linux-x64"},
              {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "platform": "linux-arm64"},
              {"os": "macos-15", "target": "aarch64-apple-darwin", "platform": "macos-arm64"},
              {"os": "macos-15-intel", "target": "x86_64-apple-darwin", "platform": "macos-x64"},
              {"os": "windows-2022", "target": "x86_64-pc-windows-msvc", "platform": "windows-x64", "interpreter": "python"},
          ]
          if os.environ["EVENT"] == "pull_request":
              wheels = [wheel for wheel in wheels if wheel["platform"] != "macos-x64"]
          shards = {w["platform"]: (2 if w["platform"] in ("windows-x64", "macos-x64") else 1) for w in wheels}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("shards=" + json.dumps(shards), file=output)
              print("wheels=" + json.dumps({"include": wheels}), file=output)
              print("others=" + json.dumps({"include": [w for w in wheels if w["platform"] not in ("linux-x64", "windows-x64")]}), file=output)
              print("tests=" + json.dumps({"include": [dict(w, shard=shard, count=shards[w["platform"]]) for w in wheels if w["platform"] not in ("linux-x64", "windows-x64") for shard in range(shards[w["platform"]])]}), file=output)
              print("platforms=" + " ".join(wheel["platform"] for wheel in wheels), file=output)
  linux-wheel:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-22.04
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/build-wheel
        with:
          target: x86_64-unknown-linux-gnu
          platform: linux-x64
          interpreter: python3.11
  windows-wheel:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-2022
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/build-wheel
        with:
          target: x86_64-pc-windows-msvc
          platform: windows-x64
          interpreter: python
    timeout-minutes: 30
  wheels:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.others) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/build-wheel
        with:
          target: ${{ matrix.target }}
          platform: ${{ matrix.platform }}
  wheel-tests:
    needs:
      - plan
      - wheels
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-wheel
        with:
          platform: ${{ matrix.platform }}
          shard: ${{ matrix.shard }}
          count: ${{ matrix.count }}
  python-compatibility:
    needs:
      - plan
      - linux-wheel
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python: '3.9'
            numpy: numpy==1.26.4
          - python: '3.14'
            numpy: numpy>=2.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: cli
      - shell: bash
        run: |
          python -m pip install dist/*.whl '${{ matrix.numpy }}' pytest h5py pandas xarray
          chmod +x cli/pelagic
        name: Install compatibility dependencies
      - name: Python compatibility tests
        shell: bash
        run: PELAGIC_CLI="$PWD/cli/pelagic" python -m pytest python/tests/test_bindings.py -q
    if: needs.plan.outputs.full == 'true'
  matlab:
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - name: Wait for exact same-run producer artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci/wait-artifacts.py --platforms ${{ needs.plan.outputs.platforms }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: cli-artifacts
          digest-mismatch: error
      - name: Verify and stage bundled CLIs
        shell: bash
        run: python tools/stage-matlab.py cli-artifacts matlab/bin --platforms ${{ needs.plan.outputs.platforms }}
      - name: Exercise toolbox archive execute-bit loss
        if: runner.os == 'Linux'
        run: chmod a-x matlab/bin/linux-x64/pelagic
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_bindings; test_curated; test_examples
      - name: Package the toolbox once, from the Linux runner
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab'); build_toolbox
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        with:
          name: matlab-toolbox
          path: target/pelagic.mltbx
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
  matlab-windows:
    if: needs.plan.outputs.full == 'true'
    needs: plan
    runs-on: windows-2022
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - name: Wait for exact same-run producer artifacts
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci/wait-artifacts.py --platforms windows-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: cli-artifacts/cli-windows-x64
          digest-mismatch: error
      - name: Verify and stage bundled CLIs
        run: python tools/stage-matlab.py cli-artifacts matlab/bin --platforms windows-x64
        shell: bash
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('matlab/tests'); test_bindings; test_curated; test_examples
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
  octave:
    needs:
      - plan
      - linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64
          path: cli
      - name: Install Octave and Java
        timeout-minutes: 10
        run: |
          # The hosted runner's Azure mirror can throttle large package downloads.
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave default-jre-headless
          octave --no-gui --quiet --eval "assert(compare_versions(OCTAVE_VERSION, '7.0.0', '>='), 'Octave 7+ required')"
      - name: Octave uses the same adapter tests
        run: |
          chmod +x cli/pelagic
          PELAGIC_CLI="$PWD/cli/pelagic" octave --no-gui --quiet --eval "addpath('matlab/tests'); test_bindings; test_curated"
    if: needs.plan.outputs.full == 'true'
  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
    needs: plan
    if: needs.plan.outputs.full == 'true'
  licenses:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install repository-pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-bin: false
          shared-key: license-sources
      - name: Download verified precompiled license tool
        run: |
          curl --fail --location --retry 3 https://github.com/sstadick/cargo-bundle-licenses/releases/download/v4.2.0/cargo-bundle-licenses-linux-amd64 -o "$RUNNER_TEMP/cargo-bundle-licenses"
          echo "4208af8db7a34b427068211e73cdd299b577245601f68c5a1c3af85e4fa4cc7c  $RUNNER_TEMP/cargo-bundle-licenses" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/cargo-bundle-licenses"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify dependency license snapshots
        run: |
          (cd crates/python && cargo bundle-licenses --format json --output /tmp/python-licenses.json --previous ../../python/pelagic/THIRD-PARTY-LICENSES.json --check-previous)
          (cd crates/cli && cargo bundle-licenses --format json --output /tmp/cli-licenses.json --previous ../../packaging/cli-licenses.json --check-previous)
  bindings-check:
    name: bindings-check
    if: always()
    needs:
      - plan
      - linux-wheel
      - windows-wheel
      - wheels
      - wheel-tests
      - python-compatibility
      - matlab
      - matlab-windows
      - octave
      - sdist
      - licenses
      - windows-check
      - linux-tests
      - windows-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require every applicable validation to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/check-results.py
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.full == 'true'
        with:
          pattern: shards-*
          path: shard-manifests
      - name: Prove disjoint and complete test shard coverage
        if: needs.plan.outputs.full == 'true'
        run: python3 tools/ci/check-shards.py shard-manifests --planned '${{ needs.plan.outputs.shards }}'
  publish-pypi:
    if: github.event_name == 'release'
    needs:
      - bindings-check
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - name: Require the release tag to match every built wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email, glob, os, zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 5, wheels
          for path in wheels:
              with zipfile.ZipFile(path) as wheel:
                  names = [n for n in wheel.namelist() if n.endswith('.dist-info/METADATA')]
                  assert len(names) == 1
                  metadata = email.message_from_bytes(wheel.read(names[0]))
                  assert metadata['Version'] == os.environ['RELEASE_TAG'].removeprefix('v')
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
  release-assets:
    if: github.event_name == 'release'
    needs:
      - bindings-check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: matlab-toolbox
          path: toolbox
      - name: Package macOS/Linux CLIs and the MATLAB toolbox
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < matlab/VERSION)"
          test "$RELEASE_TAG" = "v$version" || { echo "Release tag must be v$version" >&2; exit 1; }
          mkdir dist
          for platform in linux-x64 linux-arm64 macos-arm64 macos-x64; do
            source="cli-artifacts/cli-$platform"
            (cd "$source" && sha256sum --check --strict SHA256SUMS)
            name="pelagic-v$version-$platform"
            mkdir -p "stage/$name"
            cp "$source/pelagic" "$source/LICENSE" "$source/NOTICE" "$source/THIRD-PARTY-LICENSES.json" "stage/$name/"
            # Artifact downloads drop Unix execute bits.
            chmod 755 "stage/$name/pelagic"
            printf 'Pelagic v%s (%s)\nCommit: %s\nSource: https://github.com/%s/archive/%s.zip\n' \
              "$version" "$platform" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "stage/$name/BUILD-INFO.txt"
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          done
          cp toolbox/pelagic.mltbx "dist/pelagic-v$version.mltbx"
          cd dist
          for file in *; do sha256sum "$file" > "$file.sha256"; done
          ls -l
      - name: Attach to this Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release upload "$RELEASE_TAG" * --clobber
  windows-check:
    if: always()
    needs:
      - plan
      - windows-wheel
    runs-on: ubuntu-22.04
    steps:
      - name: Require Windows packaging validation or an explicit docs-only skip
        env:
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          BUILD: ${{ needs.windows-wheel.result }}
        run: |
          test "$PLAN" = success
          if [ "$FULL" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi
  publish-windows:
    if: github.event_name == 'release'
    needs: bindings-check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Verify and attach to this Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release upload "$RELEASE_TAG" *.zip *.sha256 --clobber
  linux-tests:
    needs:
      - plan
      - linux-wheel
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
    runs-on: ubuntu-22.04
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-wheel
        with:
          platform: linux-x64
          shard: ${{ matrix.shard }}
          count: 1
  windows-tests:
    needs:
      - plan
      - windows-wheel
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
    runs-on: windows-2022
    steps:
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-wheel
        with:
          platform: windows-x64
          shard: ${{ matrix.shard }}
          count: 2
'on':
  push:
    branches:
      - main
      - ci-benchmark/optimized-20261101
  pull_request: null
  workflow_dispatch: null
  release:
    types:
      - published
