name: Bug report
description: Pelagic crashed, gave an error it shouldn't, or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: Smallest case that shows it
      description: >
        Attach or paste a JSON case (`pelagic bellhop export case.env > case.json`),
        or the .env file and the auxiliary files it uses.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full error or output
      description: With the CLI, `--diagnostics json` gives the most precise output.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pelagic version --json`, or `pelagic.__version__` in Python
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [Command line, Python, MATLAB, Octave, HTTP server, arlpy backend]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: e.g. macOS 15 Apple silicon, Ubuntu 22.04 x86-64, Windows 11
