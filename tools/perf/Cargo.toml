[package]
name = "pelagic-perf"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bellhop = { path = "../../crates/bellhop" }
kraken = { path = "../../crates/kraken" }
serde_json = "1"

[profile.release]
debug = "line-tables-only"

# Matches the workspace: the shipped BELLHOP is built with one codegen unit.
[profile.release.package.bellhop]
codegen-units = 1

[workspace]

[lints.rust]
unsafe_code = "forbid"
