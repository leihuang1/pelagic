[package]
name = "pelagic-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
bellhop = { path = "../bellhop" }
kraken = { path = "../kraken" }
native-output = { path = "../native-output" }
pyo3 = { version = "0.27", features = ["abi3-py39", "num-complex"] }
numpy = "0.27"
serde = "1.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[lints]
workspace = true
