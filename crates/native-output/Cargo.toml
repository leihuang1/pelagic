[package]
name = "native-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bellhop = { path = "../bellhop" }
kraken = { path = "../kraken" }
sha2 = "0.10.9"
same-file = "1.0.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# SHA-NI is enabled by default on x86; 0.10's arm64 SHA2 dispatch needs `asm`.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }

# Safe fsync/F_FULLFSYNC, exclusive rename and the open-file limit; std lacks these without
# unsafe platform calls.
[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[lints]
workspace = true
