[workspace]
members = [
    "crates/bellhop",
    "crates/kraken",
    "crates/output",
    "crates/native-output",
    "crates/python",
    "crates/cli",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/leihuang1/pelagic"
publish = false

# Optimize numerical kernels, not the adapters/dependencies. Keep test safety checks.
[profile.test.package.bellhop]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.test.package.kraken]
opt-level = 2
debug-assertions = true
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
